# Companion web app + curation tool → GitHub Pages.
# Public URL: https://app.match2vote.org/  (curation tool at /curate/)
# match2vote.github.io/m2v/ redirects here once the custom domain is set.
# This is the store-rejection fallback: same code, always deployable, no gatekeeper.
name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'tools/**'
      - 'docs/launch/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

# Two deploy paths, because actions/deploy-pages started failing with runner
# TLS errors ("self-signed certificate", Node 24) and the workflow token is
# not allowed to flip the Pages source setting (403):
#   1. artifact deploy (works while Pages source = "GitHub Actions"), with the
#      NODE_TLS_REJECT_UNAUTHORIZED workaround for the TLS bug
#   2. force-push to gh-pages branch (works once Pages source = branch)
# Outcomes are logged to deploy-log.txt inside the branch for debugging.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund

      - name: Export web build
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir ../../_site

      - name: Add curation tool + SPA fallback + archived drafts
        run: |
          mkdir -p _site/curate && cp tools/curate/index.html _site/curate/
          # GitHub Pages SPA fallback: hard refresh on /ballot etc. serves the app
          cp _site/index.html _site/404.html
          # Archived drafts stay live at /v3/, /v4/, ... (self-contained builds)
          for v in docs/versions/*/; do
            name=$(basename "$v")
            if [ -f "$v/index.html" ]; then mkdir -p "_site/$name" && cp "$v/index.html" "_site/$name/"; fi
          done
          # Pages runs Jekyll on branch deploys, which would drop the _expo dir.
          touch _site/.nojekyll
          # Privacy policy at /privacy (required by Google Play + linked from the app)
          mkdir -p _site/privacy && cp docs/launch/privacy.html _site/privacy/index.html
          # Old privacy URL (github.io/m2v/privacy/) still resolves after the redirect
          mkdir -p _site/m2v/privacy && cp docs/launch/privacy.html _site/m2v/privacy/index.html
          # Custom domain. Pages reads this file on branch deploys; the setting
          # in the repo's Pages page covers artifact deploys. Keep both in sync.
          echo "app.match2vote.org" > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages (artifact path, TLS workaround)
        id: deployment
        continue-on-error: true
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        uses: actions/deploy-pages@v4

      - name: Try to point Pages at the gh-pages branch + log everything
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "deploy ${GITHUB_SHA} at $(date -u +%FT%TZ)"
            echo "deploy-pages (artifact) outcome: ${{ steps.deployment.outcome }}"
            echo "deploy-pages page_url: ${{ steps.deployment.outputs.page_url }}"
            echo "--- PUT /pages (build_type=legacy, source=gh-pages /)"
            curl -s -w '\nstatus=%{http_code}\n' -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
            echo "--- GET /pages"
            curl -s -w '\nstatus=%{http_code}\n' \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages"
          } | tee _site/deploy-log.txt

      - name: Publish to gh-pages branch
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "m2v-deploy-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Request a Pages build of the branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -w '\nstatus=%{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true

      # The whole reason deploys broke silently before: the deploy step failed
      # but nothing checked the live site. This step fails the run (red X) if
      # the exact JS bundle we just built isn't being served within ~4 minutes.
      - name: Verify the live site serves this build
        run: |
          bundle=$(basename _site/_expo/static/js/web/index-*.js)
          # Canonical host: app.match2vote.org (custom domain).
          url="https://app.match2vote.org/_expo/static/js/web/$bundle"
          echo "Checking $url"
          for i in $(seq 1 16); do
            code=$(curl -sL -o /dev/null -w '%{http_code}' "$url?v=$GITHUB_SHA-$i")
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::Live site never served the new bundle ($url). Deploy did NOT go live."
          exit 1
