# Companion web app + curation tool → GitHub Pages.
# Public URL: https://match2vote.github.io/m2v/  (curation tool at /m2v/curate/)
# This is the store-rejection fallback: same code, always deployable, no gatekeeper.
name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'tools/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

# Deploys by force-pushing the built site to the gh-pages branch (plain git,
# reliable) after the Pages API path (actions/deploy-pages) failed repeatedly
# with runner TLS errors. Pages source is set to "Deploy from a branch".
permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund

      - name: Export web build
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir ../../_site

      - name: Add curation tool + SPA fallback + archived drafts
        run: |
          mkdir -p _site/curate && cp tools/curate/index.html _site/curate/
          # GitHub Pages SPA fallback: hard refresh on /m2v/ballot etc. serves the app
          cp _site/index.html _site/404.html
          # Archived drafts stay live at /m2v/v3/, /m2v/v4/, ... (self-contained builds)
          for v in docs/versions/*/; do
            name=$(basename "$v")
            if [ -f "$v/index.html" ]; then mkdir -p "_site/$name" && cp "$v/index.html" "_site/$name/"; fi
          done
          # Pages runs Jekyll on branch deploys, which would drop the _expo dir.
          touch _site/.nojekyll

      - name: Point Pages at the gh-pages branch (logged into the branch for debugging)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "deploy ${GITHUB_SHA} at $(date -u +%FT%TZ)"
            echo "--- GET /pages"
            curl -s -w '\nstatus=%{http_code}\n' \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages"
            echo "--- PUT /pages (build_type=legacy, source=gh-pages /)"
            curl -s -w '\nstatus=%{http_code}\n' -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
            echo "--- GET /pages after PUT"
            curl -s -w '\nstatus=%{http_code}\n' \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages"
          } | tee _site/deploy-log.txt

      - name: Publish to gh-pages branch
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "m2v-deploy-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Request a Pages build of the branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -w '\nstatus=%{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
