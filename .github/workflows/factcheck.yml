# Fact-check bot on GitHub's servers.
# INSTALL: upload this file to .github/workflows/factcheck.yml in the repo
# (GitHub web: Add file > Create new file, path ".github/workflows/factcheck.yml", paste this).
# Then add the API key once: repo Settings > Secrets and variables > Actions >
# New repository secret, name GEMINI_API_KEY, value = your key from aistudio.google.com/apikey.
# RUN: repo Actions tab > "Fact-check candidate data" > Run workflow.
# When it finishes, the report (CSV + HTML) is downloadable under the run's Artifacts.
# Progress is cached between runs, so if the free daily quota runs out,
# just run it again the next day and it resumes.
# ENGINE (Sep 10, 2026): the Gemini project was suspended on Sep 7 for automated-abuse
# signals after multi-hour high-volume passes, and the whole match2vote@gmail.com
# account (which owns the Play Console) was disabled the same day; both were
# reinstated on appeal. Scheduled runs therefore use GitHub Models only and never
# send the Gemini key. Gemini is opt-in per run (engine=gemini on a manual run).
# Runs are capped at 400 calls at 5 requests per minute either way, and the bot
# slows itself further on 429/503. Keep it that way.

name: Fact-check candidate data

on:
  workflow_dispatch:
    inputs:
      states:
        description: "States to check (e.g. VT,CT) or ALL"
        default: "ALL"
      engine:
        description: "github (GitHub Models, touches no Google account) or gemini (uses the GEMINI_API_KEY secret on the match2vote Google Cloud project)"
        default: "github"
      model:
        description: "Model (default: auto — picked for the chosen engine)"
        default: "auto"
      max_calls:
        description: "Max model calls this run"
        default: "2000"
      rpm:
        description: "Requests per minute"
        default: "5"
  # Runs nightly until the pass is complete (resumes from checkpoint; near-zero API calls once done):
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: read
  models: read

jobs:
  factcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore progress from previous runs
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/factcheck/factcheck-results.jsonl
            tools/factcheck/page-cache
          key: factcheck-${{ github.run_id }}
          restore-keys: factcheck-

      - name: Run fact-check
        env:
          ENGINE: ${{ github.event.inputs.engine || 'github' }}
          GEMINI_KEY_IF_OPTED_IN: ${{ (github.event.inputs.engine == 'gemini') && secrets.GEMINI_API_KEY || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODEL="${{ github.event.inputs.model || 'auto' }}"
          MODEL_ARGS=""
          if [ "$MODEL" != "auto" ]; then MODEL_ARGS="--model $MODEL"; fi
          if [ "$ENGINE" = "gemini" ]; then export GEMINI_API_KEY="$GEMINI_KEY_IF_OPTED_IN"; fi
          node tools/factcheck/run.mjs check \
            --engine "$ENGINE" \
            --states "${{ github.event.inputs.states || 'ALL' }}" \
            $MODEL_ARGS \
            --max-calls "${{ github.event.inputs.max_calls || '400' }}" \
            --rpm "${{ github.event.inputs.rpm || '5' }}"

      - name: Save progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            tools/factcheck/factcheck-results.jsonl
            tools/factcheck/page-cache
          key: factcheck-${{ github.run_id }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factcheck-report
          path: |
            tools/factcheck/factcheck-report.html
            tools/factcheck/factcheck-report.csv
            tools/factcheck/factcheck-results.jsonl
